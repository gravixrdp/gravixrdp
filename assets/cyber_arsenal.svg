<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="arsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b11ff" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .ars-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; }
      .ars-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #8699b3; }
      .tag { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="160" rx="14" fill="url(#arsGrad)" stroke="#1a253a" stroke-width="1.2" />

  <!-- 3 Columns -->
  <!-- Col 1: Systems & Ring-0 -->
  <g transform="translate(20, 20)">
    <rect width="250" height="120" rx="10" fill="#0b101c" stroke="#1f3150" stroke-width="1" />
    <text x="15" y="28" fill="url(#neonGreenGrad)" class="ars-title" filter="url(#glowG)">⚡ SYSTEMS // RING-0</text>
    <line x1="15" y1="36" x2="235" y2="36" stroke="#1f3150" stroke-width="1" />
    
    <g transform="translate(15, 52)">
      <rect width="48" height="22" rx="5" fill="#132338" stroke="#00f2fe" stroke-width="0.8" />
      <text x="24" y="15" text-anchor="middle" fill="#00f2fe" class="tag">C / C++</text>
      
      <rect x="56" width="48" height="22" rx="5" fill="#132338" stroke="#ff4655" stroke-width="0.8" />
      <text x="80" y="15" text-anchor="middle" fill="#ff7582" class="tag">RUST</text>

      <rect x="112" width="48" height="22" rx="5" fill="#132338" stroke="#00ff87" stroke-width="0.8" />
      <text x="136" y="15" text-anchor="middle" fill="#00ff87" class="tag">eBPF</text>

      <rect x="168" width="52" height="22" rx="5" fill="#132338" stroke="#f6ad55" stroke-width="0.8" />
      <text x="194" y="15" text-anchor="middle" fill="#f6ad55" class="tag">NASM</text>
    </g>

    <text x="15" y="100" class="ars-sub">Kernel Hooks • Memory Allocators</text>
  </g>

  <!-- Col 2: Reverse Engineering -->
  <g transform="translate(300, 20)">
    <rect width="250" height="120" rx="10" fill="#0b101c" stroke="#1f3150" stroke-width="1" />
    <text x="15" y="28" fill="url(#neonPurpleGrad)" class="ars-title">🔍 BINARY ANALYSIS</text>
    <line x1="15" y1="36" x2="235" y2="36" stroke="#1f3150" stroke-width="1" />

    <g transform="translate(15, 52)">
      <rect width="45" height="22" rx="5" fill="#1c122e" stroke="#c084fc" stroke-width="0.8" />
      <text x="22" y="15" text-anchor="middle" fill="#c084fc" class="tag">GDB</text>
      
      <rect x="52" width="60" height="22" rx="5" fill="#1c122e" stroke="#f472b6" stroke-width="0.8" />
      <text x="82" y="15" text-anchor="middle" fill="#f472b6" class="tag">RADARE2</text>

      <rect x="119" width="48" height="22" rx="5" fill="#1c122e" stroke="#38bdf8" stroke-width="0.8" />
      <text x="143" y="15" text-anchor="middle" fill="#38bdf8" class="tag">GHIDRA</text>

      <rect x="174" width="46" height="22" rx="5" fill="#1c122e" stroke="#4ade80" stroke-width="0.8" />
      <text x="197" y="15" text-anchor="middle" fill="#4ade80" class="tag">IDA</text>
    </g>

    <text x="15" y="100" class="ars-sub">ELF Disassembly • Stack Canaries</text>
  </g>

  <!-- Col 3: Distributed Edge -->
  <g transform="translate(580, 20)">
    <rect width="250" height="120" rx="10" fill="#0b101c" stroke="#1f3150" stroke-width="1" />
    <text x="15" y="28" fill="url(#neonGreenGrad)" class="ars-title">🌐 DISTRIBUTED EDGE</text>
    <line x1="15" y1="36" x2="235" y2="36" stroke="#1f3150" stroke-width="1" />

    <g transform="translate(15, 52)">
      <rect width="52" height="22" rx="5" fill="#102422" stroke="#f97316" stroke-width="0.8" />
      <text x="26" y="15" text-anchor="middle" fill="#f97316" class="tag">WORKERS</text>
      
      <rect x="59" width="56" height="22" rx="5" fill="#102422" stroke="#38bdf8" stroke-width="0.8" />
      <text x="87" y="15" text-anchor="middle" fill="#38bdf8" class="tag">TCP/IP</text>

      <rect x="122" width="48" height="22" rx="5" fill="#102422" stroke="#4ade80" stroke-width="0.8" />
      <text x="146" y="15" text-anchor="middle" fill="#4ade80" class="tag">REDIS</text>

      <rect x="177" width="44" height="22" rx="5" fill="#102422" stroke="#a855f7" stroke-width="0.8" />
      <text x="199" y="15" text-anchor="middle" fill="#a855f7" class="tag">SSE</text>
    </g>

    <text x="15" y="100" class="ars-sub">Sub-5ms Routing • Protocol Stream</text>
  </g>
</svg>
