<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <linearGradient id="gRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <filter id="glowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .hex-txt { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; }
      .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      @keyframes blinkP { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      .p-blink { animation: blinkP 1s infinite; }
    </style>
  </defs>

  <rect width="850" height="200" rx="14" fill="url(#pBg)" stroke="#1a2638" stroke-width="1.2" />

  <!-- Grid Accents -->
  <g stroke="#141d2d" stroke-width="0.7">
    <line x1="425" y1="0" x2="425" y2="200" />
    <line x1="0" y1="38" x2="850" y2="38" />
  </g>

  <!-- Left Header -->
  <text x="25" y="26" fill="url(#gGreen)" class="lbl" filter="url(#glowGlow)">[ 0x01 ] SHELLCODE_PAYLOAD // x86_64_EXECVE</text>
  <circle cx="390" cy="22" r="4" fill="#00ff87" class="p-blink" />

  <!-- Left Content: Shellcode & Byte Map -->
  <g transform="translate(25, 48)" class="hex-txt">
    <text y="15" fill="#6b7d96">00000000: <tspan fill="#00ff87">48 31 f6 56 48 bf 2f 62</tspan> <tspan fill="#60efff">69 6e 2f 2f 73 68 57 54</tspan>  <tspan fill="#94a3b8">H1.VH./bin//shWT</tspan></text>
    <text y="35" fill="#6b7d96">00000010: <tspan fill="#00ff87">5f 6a 3b 58 99 0f 05 90</tspan> <tspan fill="#ff007a">90 90 90 90 90 90 90 90</tspan>  <tspan fill="#94a3b8">_j;X...........</tspan></text>
    <text y="55" fill="#6b7d96">00000020: <tspan fill="#60efff">ff e4 48 89 e7 48 31 d2</tspan> <tspan fill="#00ff87">48 83 c4 10 0f 05 c3 00</tspan>  <tspan fill="#94a3b8">..H..H1.H.......</tspan></text>
    <text y="75" fill="#6b7d96">00000030: <tspan fill="#ff007a">41 58 41 59 41 5a 41 5b</tspan> <tspan fill="#60efff">48 8b 04 24 c3 90 90 90</tspan>  <tspan fill="#94a3b8">AXAYAZA[H..$....</tspan></text>
    <text y="95" fill="#6b7d96">00000040: <tspan fill="#00ff87">eb 1e 5e 48 31 c0 88 46</tspan> <tspan fill="#60efff">07 48 89 76 08 48 89 46</tspan>  <tspan fill="#94a3b8">..^H1..F.H.v.H.F</tspan></text>
    <text y="115" fill="#6b7d96">STATUS: <tspan fill="#00ff87">27 BYTES INJECTED</tspan> | MEM: <tspan fill="#60efff">RWX_MAPPED</tspan> | NULL_BYTES: <tspan fill="#00ff87">0 (CLEAN)</tspan></text>
  </g>

  <!-- Right Header -->
  <text x="450" y="26" fill="url(#gRed)" class="lbl">[ 0x02 ] EXPLOIT_MITIGATIONS // BYPASS_STATE</text>
  <circle cx="815" cy="22" r="4" fill="#ff007a" class="p-blink" />

  <!-- Right Content: Mitigations Matrix -->
  <g transform="translate(450, 48)" class="hex-txt">
    <text y="15" fill="#8899ac">CANARY (Stack Guard):   <tspan fill="#00ff87" font-weight="bold">[ BYPASS // LEAKED ]</tspan></text>
    <text y="35" fill="#8899ac">NX / DEP (No-Execute):  <tspan fill="#00ff87" font-weight="bold">[ ROP_CHAIN_ARMED ]</tspan></text>
    <text y="55" fill="#8899ac">PIE (Position Indep):   <tspan fill="#00ff87" font-weight="bold">[ BASE_OFFSET_FOUND ]</tspan></text>
    <text y="75" fill="#8899ac">ASLR (Entropy 32-bit):  <tspan fill="#00ff87" font-weight="bold">[ DE-RANDOMIZED ]</tspan></text>
    <text y="95" fill="#8899ac">RELRO (Full RELRO):     <tspan fill="#ff007a" font-weight="bold">[ HOOK_OVERWRITE_ACTIVE ]</tspan></text>
    <text y="115" fill="#8899ac">PRIVILEGES:             <tspan fill="#00ff87" font-weight="bold">uid=0(root) gid=0(root)</tspan></text>
  </g>
</svg>
