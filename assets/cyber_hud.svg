<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c101d" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseRing {
        0% { transform: rotate(0deg); opacity: 0.8; }
        50% { opacity: 0.3; }
        100% { transform: rotate(360deg); opacity: 0.8; }
      }
      @keyframes pulseRingRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(260px); }
      }
      @keyframes glitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(-2px, -2px); }
        60% { transform: translate(2px, 2px); }
        80% { transform: translate(2px, -2px); }
      }
      .ring-1 { transform-origin: 130px 130px; animation: pulseRing 12s linear infinite; }
      .ring-2 { transform-origin: 130px 130px; animation: pulseRingRev 8s linear infinite; }
      .radar-core { transform-origin: 130px 130px; }
      .cursor { animation: blinkCursor 0.8s infinite; }
      .hud-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; }
      .hud-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 16px; font-weight: 800; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background Panel -->
  <rect width="850" height="260" rx="16" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g stroke="#161f30" stroke-width="0.8" opacity="0.6">
    <line x1="260" y1="0" x2="260" y2="260" />
    <line x1="560" y1="0" x2="560" y2="260" />
    <line x1="0" y1="65" x2="850" y2="65" />
    <line x1="0" y1="195" x2="850" y2="195" />
    <!-- Diagonal corner ticks -->
    <line x1="10" y1="10" x2="30" y2="10" stroke="#00f2fe" stroke-width="2" />
    <line x1="10" y1="10" x2="10" y2="30" stroke="#00f2fe" stroke-width="2" />
    <line x1="840" y1="10" x2="820" y2="10" stroke="#00f2fe" stroke-width="2" />
    <line x1="840" y1="10" x2="840" y2="30" stroke="#00f2fe" stroke-width="2" />
    <line x1="10" y1="250" x2="30" y2="250" stroke="#00ff87" stroke-width="2" />
    <line x1="10" y1="250" x2="10" y2="230" stroke="#00ff87" stroke-width="2" />
    <line x1="840" y1="250" x2="820" y2="250" stroke="#00ff87" stroke-width="2" />
    <line x1="840" y1="250" x2="840" y2="230" stroke="#00ff87" stroke-width="2" />
  </g>

  <!-- LEFT HUD: Cybernetic Radar & Quantum Gyro -->
  <g transform="translate(0, 0)">
    <!-- Outer Ring -->
    <circle cx="130" cy="130" r="75" fill="none" stroke="#162b47" stroke-width="2" stroke-dasharray="8 4" />
    <!-- Rotating Dashed Ring 1 -->
    <circle class="ring-1" cx="130" cy="130" r="62" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="30 15 10 5" filter="url(#glowCyan)" />
    <!-- Rotating Dashed Ring 2 -->
    <circle class="ring-2" cx="130" cy="130" r="48" fill="none" stroke="url(#neonGreen)" stroke-width="1.5" stroke-dasharray="15 25" filter="url(#glowGreen)" />
    <!-- Target Crosshairs -->
    <line x1="130" y1="45" x2="130" y2="215" stroke="#00f2fe" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.6" />
    <line x1="45" y1="130" x2="215" y2="130" stroke="#00f2fe" stroke-width="0.7" stroke-dasharray="2 4" opacity="0.6" />
    <!-- Center Core -->
    <circle cx="130" cy="130" r="8" fill="#00ff87" filter="url(#glowGreen)" />
    <circle cx="130" cy="130" r="18" fill="none" stroke="#00ff87" stroke-width="1" opacity="0.5" />
    <!-- Radar Text -->
    <text x="130" y="235" text-anchor="middle" fill="#00f2fe" class="hud-text" font-weight="700" letter-spacing="1">RING-0 // ACTIVE</text>
  </g>

  <!-- CENTER HUD: Live Hex Memory Stream & Subsystem Core -->
  <g transform="translate(280, 0)">
    <text x="0" y="40" fill="url(#neonGreen)" class="hud-title" filter="url(#glowGreen)">GRAVIX // APEX INTERNALS</text>
    <line x1="0" y1="50" x2="260" y2="50" stroke="url(#neonGreen)" stroke-width="1.5" />

    <text x="0" y="75" fill="#8b9bb4" class="hud-text">STATUS: <tspan fill="#00ff87" font-weight="bold">SOVEREIGN CORE LOADED</tspan></text>
    <text x="0" y="95" fill="#8b9bb4" class="hud-text">ARCH: <tspan fill="#00f2fe">x86_64_LINUX_KERNEL_RING0</tspan></text>
    <text x="0" y="115" fill="#8b9bb4" class="hud-text">MEMORY_MAP: <tspan fill="#ff007a">0x00007FFF5FBFF000</tspan></text>
    <text x="0" y="135" fill="#8b9bb4" class="hud-text">VECTORS: <tspan fill="#ffffff">[REVERSE_ENG, eBPF, EDGE_ROUTER]</tspan></text>
    <text x="0" y="155" fill="#8b9bb4" class="hud-text">THROUGHPUT: <tspan fill="#00ff87">&lt; 2.4ms GLOBAL LATENCY</tspan></text>
    <text x="0" y="175" fill="#8b9bb4" class="hud-text">ENTROPY: <tspan fill="#00f2fe">0xDEADBEEFCAFE0001</tspan></text>

    <!-- Progress / Allocation Bar -->
    <text x="0" y="210" fill="#6c7d93" class="hud-text">SUBSYSTEM ALLOCATION</text>
    <rect x="0" y="218" width="240" height="8" rx="4" fill="#131c2e" />
    <rect x="0" y="218" width="216" height="8" rx="4" fill="url(#neonGreen)" filter="url(#glowGreen)" />
    <text x="248" y="226" fill="#00ff87" class="hud-text" font-weight="bold">92%</text>
  </g>

  <!-- RIGHT HUD: Live Disassembly & Register Probe -->
  <g transform="translate(580, 0)">
    <text x="0" y="40" fill="url(#neonCyan)" class="hud-title">REGISTER TELEMETRY</text>
    <line x1="0" y1="50" x2="245" y2="50" stroke="url(#neonCyan)" stroke-width="1.5" />

    <g class="hud-text" fill="#a5b4cb">
      <text x="0" y="75">RAX: <tspan fill="#00f2fe">0x0000000000000001</tspan></text>
      <text x="0" y="95">RBX: <tspan fill="#00ff87">0x00007FFFFFFFE480</tspan></text>
      <text x="0" y="115">RCX: <tspan fill="#ff007a">0xDEADBEEF00001337</tspan></text>
      <text x="0" y="135">RDX: <tspan fill="#00f2fe">0x0000000000401080</tspan></text>
      <text x="0" y="155">RSP: <tspan fill="#00ff87">0x00007FFFFFFFE3F0</tspan></text>
      <text x="0" y="175">RIP: <tspan fill="#ff007a">&lt;sys_enter+0x42&gt;</tspan></text>
    </g>

    <!-- Live Execution Stream Line -->
    <rect x="0" y="200" width="245" height="32" rx="6" fill="#0f1523" stroke="#1f2d45" />
    <text x="10" y="221" fill="#00ff87" class="hud-text">> syscall 0x3b <tspan class="cursor" fill="#00f2fe">_</tspan></text>
  </g>
</svg>
